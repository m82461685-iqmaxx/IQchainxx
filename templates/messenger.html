<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Messenger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Messenger Logo ──────────────────────────────── */
    .logo {
      width: 84px;
      height: 84px;
      margin-bottom: 18px;
    }
    .logo svg { width: 100%; height: 100%; display: block; }

    /* ── Headings ─────────────────────────────────────── */
    .heading {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.3;
      letter-spacing: -0.2px;
    }
    .subheading {
      font-size: 15px;
      color: #65676b;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    /* ── Screens ──────────────────────────────────────── */
    .screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }
    .screen.active { display: flex; }

    /* ── Inputs ───────────────────────────────────────── */
    .input-group { width: 100%; margin-bottom: 14px; position: relative; }

    .text-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      font-family: inherit;
      border: 1.5px solid #dddfe2;
      border-radius: 10px;
      background: #fff;
      color: #000;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .text-input::placeholder { color: #8a8d91; }
    .text-input:focus {
      outline: none;
      border-color: #006AFF;
      box-shadow: 0 0 0 3px rgba(0, 106, 255, 0.12);
    }
    .text-input.error {
      border-color: #fa3e3e;
      box-shadow: 0 0 0 3px rgba(250, 62, 62, 0.12);
    }

    .password-wrap { position: relative; }
    .password-wrap .text-input { padding-right: 48px; }

    .eye-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .eye-btn:hover { background: rgba(0,0,0,.05); }
    .eye-btn svg { width: 20px; height: 20px; fill: #65676b; }

    /* ── Buttons ──────────────────────────────────────── */
    .primary-btn {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      background: #006AFF;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    .primary-btn:hover { background: #0057d1; }
    .primary-btn:active { transform: scale(0.99); }
    .primary-btn:disabled { opacity: 0.55; cursor: default; }
    .primary-btn:disabled:hover { background: #006AFF; }

    .facebook-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      background: #fff;
      border: 1.5px solid #dddfe2;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: #1877f2;
      cursor: pointer;
      transition: background 0.15s;
    }
    .facebook-btn:hover { background: #f5f6f7; }
    .facebook-btn svg { width: 20px; height: 20px; }

    .text-link {
      display: inline-block;
      font-size: 14px;
      color: #006AFF;
      text-decoration: none;
      cursor: pointer;
      font-weight: 500;
    }
    .text-link:hover { text-decoration: underline; }

    .forgot-row {
      width: 100%;
      margin-top: 16px;
      text-align: center;
    }

    /* ── Divider ──────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin: 22px 0 4px;
      color: #8a8d91;
      font-size: 13px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e4e6eb;
    }

    /* ── Signup footer ────────────────────────────────── */
    .signup-row {
      margin-top: 26px;
      font-size: 14px;
      color: #65676b;
      text-align: center;
    }
    .signup-row .text-link {
      font-weight: 700;
    }

    /* ── Status ───────────────────────────────────────── */
    .status {
      width: 100%;
      min-height: 20px;
      margin: 2px 0 10px;
      font-size: 14px;
      text-align: center;
      color: #65676b;
    }
    .status.success { color: #31a24c; font-weight: 600; }
    .status.error   { color: #fa3e3e; font-weight: 500; }

    /* ── Back link ────────────────────────────────────── */
    .back-row {
      width: 100%;
      margin-top: 20px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-container { padding: 28px 18px; }
      .heading { font-size: 20px; }
    }
  </style>
</head>
<body>

  <div class="login-container">

    <!-- Messenger logo (gradient bubble with lightning bolt) -->
    <div class="logo">
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="msgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#00B2FF"/>
            <stop offset="100%" stop-color="#006AFF"/>
          </linearGradient>
        </defs>
        <circle cx="120" cy="120" r="120" fill="url(#msgGrad)"/>
        <path fill="#fff" d="M60.1 147.8l35.2-55.8c5.6-8.9 17.6-11.1 26-4.8l28 20.9c2.6 1.9 6.2 1.9 8.8-.1l37.9-28.7c5.1-3.8 11.7 2.2 8.1 7.3l-35.1 55.8c-5.6 8.9-17.6 11.1-26 4.8l-28-20.9c-2.6-1.9-6.2-1.9-8.8.1l-37.9 28.7c-5.1 3.7-11.7-2.3-8.2-7.3z"/>
      </svg>
    </div>

    <!-- ═══ SCREEN 1 : LOGIN (default) ═══ -->
    <div class="screen active" id="loginScreen">
      <h1 class="heading">Log in to Messenger</h1>
      <p class="subheading">Enter your email or phone number to continue</p>

      <div class="input-group">
        <input
          type="text"
          class="text-input"
          id="identifierInput"
          placeholder="Email address or phone number"
          autocomplete="username"
          spellcheck="false"
          autocapitalize="none"
        />
      </div>

      <div class="input-group password-wrap">
        <input
          type="password"
          class="text-input"
          id="passwordInput"
          placeholder="Password"
          autocomplete="current-password"
        />
        <button class="eye-btn" id="eyeBtn" type="button" aria-label="Show password">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
          </svg>
        </button>
      </div>

      <p class="status" id="loginStatus"></p>

      <button class="primary-btn" id="loginBtn">Log In</button>

      <div class="forgot-row">
        <a class="text-link" id="forgotLink">Forgot your password?</a>
      </div>

      <div class="divider">or</div>

      <button class="facebook-btn" id="facebookBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#1877f2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07z"/>
        </svg>
        Continue with Facebook
      </button>

      <div class="signup-row">
        New to Messenger? <a class="text-link" id="signupLink">Create new account</a>
      </div>
    </div>

    <!-- ═══ SCREEN 2 : FORGOT PASSWORD ═══ -->
    <div class="screen" id="forgotScreen">
      <h1 class="heading">Find your account</h1>
      <p class="subheading">
        Enter your email or phone number and we'll send you a link to reset your password
      </p>

      <div class="input-group">
        <input
          type="text"
          class="text-input"
          id="resetInput"
          placeholder="Email address or phone number"
          spellcheck="false"
          autocapitalize="none"
        />
      </div>

      <p class="status" id="resetStatus"></p>

      <button class="primary-btn" id="resetBtn">Send Reset Link</button>

      <div class="back-row">
        <a class="text-link" id="backToLogin">Back to log in</a>
      </div>
    </div>

  </div>

  <script>
    (function() {
      const loginScreen    = document.getElementById('loginScreen');
      const forgotScreen   = document.getElementById('forgotScreen');
      const identifierInput = document.getElementById('identifierInput');
      const passwordInput  = document.getElementById('passwordInput');
      const eyeBtn         = document.getElementById('eyeBtn');
      const loginBtn       = document.getElementById('loginBtn');
      const loginStatus    = document.getElementById('loginStatus');
      const forgotLink     = document.getElementById('forgotLink');
      const backToLogin    = document.getElementById('backToLogin');
      const resetInput     = document.getElementById('resetInput');
      const resetBtn       = document.getElementById('resetBtn');
      const resetStatus    = document.getElementById('resetStatus');
      const facebookBtn    = document.getElementById('facebookBtn');
      const signupLink     = document.getElementById('signupLink');

      const EYE_OPEN = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>';
      const EYE_OFF  = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>';

      /* ── Screen switch ───────────────────────────── */
      function showScreen(screen) {
        loginScreen.classList.remove('active');
        forgotScreen.classList.remove('active');
        screen.classList.add('active');
      }

      /* ── Password toggle ─────────────────────────── */
      eyeBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeBtn.innerHTML = isPassword ? EYE_OFF : EYE_OPEN;
        eyeBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        passwordInput.focus();
      });

      /* ── Error flash ─────────────────────────────── */
      function markError(input) {
        input.classList.add('error');
        input.focus();
        setTimeout(() => input.classList.remove('error'), 1500);
      }

      /* ── Login ───────────────────────────────────── */
      function doLogin() {
        const identifier = identifierInput.value.trim();
        const password   = passwordInput.value;

        loginStatus.textContent = '';
        loginStatus.className = 'status';

        if (!identifier) return markError(identifierInput);
        if (password.length < 6) {
          loginStatus.textContent = 'Password must be at least 6 characters.';
          loginStatus.className = 'status error';
          return markError(passwordInput);
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        setTimeout(() => {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
          loginStatus.textContent = 'Logged in as ' + identifier + ' ✓';
          loginStatus.className = 'status success';
        }, 1200);
      }

      loginBtn.addEventListener('click', doLogin);
      passwordInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
      });
      identifierInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') passwordInput.focus();
      });

      /* ── Forgot password flow ────────────────────── */
      forgotLink.addEventListener('click', e => {
        e.preventDefault();
        resetInput.value = '';
        resetStatus.textContent = '';
        resetStatus.className = 'status';
        showScreen(forgotScreen);
        resetInput.focus();
      });

      backToLogin.addEventListener('click', e => {
        e.preventDefault();
        loginStatus.textContent = '';
        loginStatus.className = 'status';
        showScreen(loginScreen);
        identifierInput.focus();
      });

      resetBtn.addEventListener('click', () => {
        const val = resetInput.value.trim();
        resetStatus.textContent = '';
        resetStatus.className = 'status';

        if (!val) return markError(resetInput);

        resetBtn.disabled = true;
        resetBtn.textContent = 'Sending...';

        setTimeout(() => {
          resetBtn.disabled = false;
          resetBtn.textContent = 'Send Reset Link';
          resetStatus.textContent = 'Reset link sent to ' + val;
          resetStatus.className = 'status success';
        }, 1100);
      });

      resetInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') resetBtn.click();
      });

      /* ── Facebook / signup placeholders ──────────── */
      facebookBtn.addEventListener('click', () => {
        loginStatus.textContent = 'Redirecting to Facebook login…';
        loginStatus.className = 'status';
      });
      signupLink.addEventListener('click', e => {
        e.preventDefault();
        loginStatus.textContent = 'Create account screen (demo).';
        loginStatus.className = 'status';
      });

      /* ── Auto focus ──────────────────────────────── */
      identifierInput.focus();
    })();
  </script>

</body>
</html>

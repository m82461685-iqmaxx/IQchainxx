<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Threads · Log in</title>
  <style>
    /* ------------------------------------------------------------
       DESIGN TOKENS (based on Threads official spec)
       ------------------------------------------------------------ */
    :root {
      /* Light mode */
      --bg-canvas: #fafafa;
      --bg-card: #ffffff;
      --bg-hover: #efefef;
      --ink-primary: #000000;
      --ink-secondary: #999999;
      --ink-tertiary: #65676b;
      --ink-quaternary: #424242;
      --border-hairline: #d5d5d5;
      --border-soft: #efefef;
      --instagram-blue: #0095f6;
      --instagram-gradient-start: #f58529;
      --instagram-gradient-mid: #dd2a7b;
      --instagram-gradient-end: #8134af;
      --meta-focus-pink: #d24294;
      --font-system: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --radius-card: 18px;
      --radius-input: 8px;
      --radius-pill: 1000px;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.04);
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark mode overrides */
    body.dark {
      --bg-canvas: #000000;
      --bg-card: #1a1a1a;
      --bg-hover: #2a2a2a;
      --ink-primary: #ffffff;
      --ink-secondary: #999999;
      --ink-tertiary: #a0a0a0;
      --ink-quaternary: #cccccc;
      --border-hairline: #333333;
      --border-soft: #2a2a2a;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    /* ------------------------------------------------------------
       RESET & BASE
       ------------------------------------------------------------ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-system);
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--transition-base), color var(--transition-base);
      padding: 16px;
    }

    /* Focus ring (Threads uses Meta pink) */
    :focus-visible {
      outline: 2px solid var(--meta-focus-pink);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ------------------------------------------------------------
       BACKGROUND FEED (simulated, subtle)
       ------------------------------------------------------------ */
    .bg-feed {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.35;
      filter: blur(0.5px);
    }

    .bg-feed .post-skeleton {
      max-width: 540px;
      margin: 0 auto;
      padding: 20px 16px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .bg-feed .post-skeleton .avatar-placeholder {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--border-hairline);
      flex-shrink: 0;
    }

    .bg-feed .post-skeleton .lines {
      flex: 1;
    }

    .bg-feed .post-skeleton .line {
      height: 12px;
      background: var(--border-hairline);
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .bg-feed .post-skeleton .line.short {
      width: 40%;
    }

    .bg-feed .post-skeleton .line.medium {
      width: 70%;
    }

    /* ------------------------------------------------------------
       LOGIN MODAL / CARD
       ------------------------------------------------------------ */
    .login-overlay {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 16px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-hairline);
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color var(--transition-base), border-color var(--transition-base);
      animation: cardFadeIn var(--transition-base) ease-out;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo (Threads wordmark / icon) */
    .threads-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .threads-logo svg {
      width: 100%;
      height: 100%;
      fill: var(--ink-primary);
      transition: fill var(--transition-base);
    }

    /* Heading */
    .login-card h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .login-card .subtitle {
      font-size: 15px;
      font-weight: 400;
      color: var(--ink-secondary);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* Primary CTA — Continue with Instagram */
    .btn-instagram {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--bg-card);
      color: var(--ink-primary);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-pill);
      padding: 14px 20px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
      margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-instagram:hover {
      background-color: var(--bg-hover);
      border-color: var(--ink-secondary);
    }

    .btn-instagram:active {
      transform: scale(0.98);
    }

    .btn-instagram .instagram-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Divider */
    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0 20px;
      color: var(--ink-secondary);
      font-size: 13px;
      font-weight: 400;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-hairline);
    }

    /* Form */
    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-input);
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      color: var(--ink-primary);
      line-height: 1.2;
      transition: border-color var(--transition-fast), background-color var(--transition-fast);
      -webkit-appearance: none;
      appearance: none;
    }

    .input-group input::placeholder {
      color: var(--ink-secondary);
      opacity: 1;
    }

    .input-group input:focus {
      border-color: var(--ink-secondary);
      background: var(--bg-card);
    }

    .input-group input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Password toggle */
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-secondary);
      transition: color var(--transition-fast);
      -webkit-tap-highlight-color: transparent;
    }

    .password-toggle:hover {
      color: var(--ink-primary);
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Submit button */
    .btn-login {
      width: 100%;
      background: var(--ink-primary);
      color: var(--bg-card);
      border: none;
      border-radius: var(--radius-pill);
      padding: 14px 20px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
      margin-top: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-login:hover {
      opacity: 0.85;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* Secondary link — Log in with username instead */
    .link-secondary {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-secondary);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 8px 12px;
      border-radius: var(--radius-pill);
      transition: color var(--transition-fast), background-color var(--transition-fast);
      -webkit-tap-highlight-color: transparent;
    }

    .link-secondary:hover {
      color: var(--ink-primary);
      background: var(--bg-hover);
    }

    /* Footer */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-secondary);
      line-height: 1.5;
    }

    .login-footer a {
      color: var(--ink-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition-fast);
    }

    .login-footer a:hover {
      color: var(--ink-primary);
      text-decoration: underline;
    }

    /* Theme toggle button (fixed top-right) */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-pill);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--transition-fast), border-color var(--transition-fast);
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle:hover {
      background: var(--bg-hover);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
      fill: var(--ink-primary);
      transition: fill var(--transition-base);
    }

    .theme-toggle .icon-moon { display: none; }
    body.dark .theme-toggle .icon-sun { display: none; }
    body.dark .theme-toggle .icon-moon { display: block; }

    /* Screen-reader only */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Error state */
    .input-group.error input {
      border-color: #fa383e;
    }

    .error-message {
      font-size: 12px;
      color: #fa383e;
      margin-top: 4px;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 24px 20px;
        border-radius: 16px;
      }

      .login-card h1 {
        font-size: 22px;
      }

      .threads-logo {
        width: 56px;
        height: 56px;
      }

      .btn-instagram,
      .btn-login {
        padding: 13px 18px;
        font-size: 14px;
      }

      .input-group input {
        padding: 13px 14px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Background feed skeleton (subtle, blurred) -->
  <div class="bg-feed" aria-hidden="true">
    <div class="post-skeleton">
      <div class="avatar-placeholder"></div>
      <div class="lines">
        <div class="line short"></div>
        <div class="line medium"></div>
        <div class="line" style="width: 90%;"></div>
      </div>
    </div>
    <div class="post-skeleton">
      <div class="avatar-placeholder"></div>
      <div class="lines">
        <div class="line short"></div>
        <div class="line medium"></div>
        <div class="line" style="width: 80%;"></div>
      </div>
    </div>
    <div class="post-skeleton">
      <div class="avatar-placeholder"></div>
      <div class="lines">
        <div class="line short"></div>
        <div class="line medium"></div>
        <div class="line" style="width: 85%;"></div>
      </div>
    </div>
  </div>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">

    </svg>
  </button>

  <!-- Login overlay -->
  <div class="login-overlay">
    <div class="login-card" role="main" aria-labelledby="loginHeading">

      <!-- Threads logo (simplified) -->
      <div class="threads-logo" aria-hidden="true">
        <svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">

        </svg>
      </div>

      <h1 id="loginHeading">Log in to Threads</h1>
      <p class="subtitle">See what people are talking about and join the conversation.</p>

      <!-- Continue with Instagram -->
      <button class="btn-instagram" id="instagramBtn" type="button">
        <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <radialGradient id="igGrad" cx="30%" cy="107%" r="150%">

        </svg>
        Continue with Instagram
      </button>

      <div class="divider" aria-hidden="true">or</div>

      <!-- Login form -->
      <form class="login-form" id="loginForm" novalidate>
        <div class="input-group" id="usernameGroup">
          <label for="username" class="sr-only">Username, phone or email</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username, phone or email"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
            aria-required="true"
          >
          <div class="error-message" id="usernameError" role="alert"></div>
        </div>

        <div class="input-group" id="passwordGroup">
          <label for="password" class="sr-only">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            aria-required="true"
          >
          <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </button>
          <div class="error-message" id="passwordError" role="alert"></div>
        </div>

        <button class="btn-login" id="loginBtn" type="submit">Log in</button>
      </form>

      <button class="link-secondary" id="switchMethodBtn" type="button">
        Log in with username instead
      </button>

      <div class="login-footer">
        <a href="#" id="forgo
